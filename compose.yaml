services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - backend/.postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - artery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - backend/.env
    environment:
      DB_HOST: db
      ML_PYTHON_EXECUTABLE: /opt/ml-venv/bin/python
      ATTENTION_CHECKPOINT_PATH: /models/best_attention_unet.pt
      UNETPP_CHECKPOINT_PATH: /models/best_unetpp.pt
      UPLOAD_DIRECTORY: /app/backend/storage/uploads
      ANALYSIS_OUTPUT_DIRECTORY: /app/backend/storage/analysis
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      EMAIL_VERIFICATION_FRONTEND_URL: http://localhost:8080
    volumes:
      - type: bind
        source: ./backend/storage
        target: /app/backend/storage
      - type: bind
        source: ./ml/checkpoints/best_attention_unet.pt
        target: /models/best_attention_unet.pt
        read_only: true
      - type: bind
        source: "D:/Internship Project/Important outputs/Stenosis detection outputs/stenosis_unetpp_training_backup/stenosis_unetpp_training/checkpoints/best_unetpp.pt"
        target: /models/best_unetpp.pt
        read_only: true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  artery_postgres_data:
